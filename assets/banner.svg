<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#0d1b2a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3b5c" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#131e36" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#00f2fe;#38ef7d;#00f2fe" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#4facfe" stop-opacity="1">
        <animate attributeName="stop-color" values="#4facfe;#00f2fe;#4facfe" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.9">
        <animate attributeName="stop-color" values="#9d4edd;#4facfe;#9d4edd" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glowPoint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(-1.5deg); }
      }
      @keyframes pulseAura {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.15); opacity: 0.65; }
      }
      @keyframes pulseSmall {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.3); opacity: 1; }
      }
      @keyframes dashAnim {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes bounceArrow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(6px); }
      }
      @keyframes spinGlow {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .floating-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-2 {
        animation: floatFast 7s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-3 {
        animation: floatSlow 8s ease-in-out infinite 1s;
        transform-origin: center;
      }
      .aura-glow {
        animation: pulseAura 5s ease-in-out infinite;
        transform-origin: center;
      }
      .stream-line {
        stroke-dasharray: 20, 10;
        animation: dashAnim 4s linear infinite;
      }
      .stream-line-fast {
        stroke-dasharray: 12, 8;
        animation: dashAnim 2.5s linear infinite;
      }
      .download-arrow {
        animation: bounceArrow 1.8s ease-in-out infinite;
        transform-origin: center;
      }
      .sparkle {
        animation: pulseSmall 3s ease-in-out infinite;
      }
      .sparkle-2 {
        animation: pulseSmall 4s ease-in-out infinite 1.5s;
      }
      .rotating-ring {
        animation: spinGlow 20s linear infinite;
        transform-origin: 970px 160px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Background Decorative Glowing Orbs -->
  <circle cx="150" cy="80" r="180" fill="url(#glowPoint)" class="aura-glow" />
  <circle cx="980" cy="160" r="220" fill="url(#purpleGlow)" class="aura-glow" />
  <circle cx="650" cy="280" r="150" fill="url(#glowPoint)" class="aura-glow" />

  <!-- Border Highlight Stroke -->
  <rect width="1198" height="318" x="1" y="1" rx="15" fill="none" stroke="url(#primaryGrad)" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Ambient Light Streams / Curved Wires -->
  <g opacity="0.6">
    <path d="M 0,160 Q 300,50 600,160 T 1200,160" fill="none" stroke="url(#streamGrad)" stroke-width="1.5" class="stream-line" />
    <path d="M 0,220 Q 350,300 700,200 T 1200,100" fill="none" stroke="url(#streamGrad)" stroke-width="1" class="stream-line-fast" opacity="0.4" />
  </g>

  <!-- Rotating tech circle on right side -->
  <g class="rotating-ring" opacity="0.3">
    <circle cx="970" cy="160" r="110" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="10 20" />
    <circle cx="970" cy="160" r="130" fill="none" stroke="#7928ca" stroke-width="1" stroke-dasharray="40 40" />
  </g>

  <!-- Sparkles / Particles -->
  <circle cx="480" cy="50" r="2" fill="#00f2fe" class="sparkle" />
  <circle cx="560" cy="120" r="1.5" fill="#38ef7d" class="sparkle-2" />
  <circle cx="110" cy="240" r="2.5" fill="#00e5ff" class="sparkle" />
  <circle cx="670" cy="60" r="2" fill="#9d4edd" class="sparkle-2" />
  <circle cx="1120" cy="270" r="2" fill="#00f2fe" class="sparkle" />
  <circle cx="830" cy="40" r="1.5" fill="#4facfe" class="sparkle" />

  <!-- LEFT CONTENT: BRANDING & HEADLINE -->
  <g transform="translate(60, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 42)">
      <rect width="210" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="16" cy="15" r="5" fill="#38ef7d">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="19.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">HIGH-PERFORMANCE v2.0</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 115)">
      <text fill="url(#shimmerGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
        BETTER BING
      </text>
      <text x="0" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
        IMAGE DOWNLOADER
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <g transform="translate(0, 192)">
      <text fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">
        Supercharged multi-threaded image harvester for <tspan fill="#38bdf8" font-weight="600">Bing</tspan> &amp; <tspan fill="#4ade80" font-weight="600">Google</tspan>
      </text>
    </g>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 226)">
      <!-- Badge 1: Parallel Speed -->
      <g transform="translate(0, 0)">
        <rect width="132" height="34" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
        <path d="M14 17 L21 9 L18 17 L24 17 L16 26 L18 19 Z" fill="#fbbf24" />
        <text x="32" y="21.5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Async / Parallel</text>
      </g>

      <!-- Badge 2: Dual Engine -->
      <g transform="translate(142, 0)">
        <rect width="128" height="34" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="17" r="6" fill="none" stroke="#38bdf8" stroke-width="2" />
        <path d="M20 21 L25 26" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
        <text x="32" y="21.5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Dual Engine</text>
      </g>

      <!-- Badge 3: CLI + Python API -->
      <g transform="translate(280, 0)">
        <rect width="126" height="34" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
        <text x="13" y="22" fill="#a855f7" font-family="monospace" font-size="13" font-weight="800">&gt;_</text>
        <text x="34" y="21.5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">CLI &amp; Python</text>
      </g>

      <!-- Badge 4: Smart Filters -->
      <g transform="translate(416, 0)">
        <rect width="126" height="34" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
        <path d="M12 12 L24 12 L19 18 L19 23 L17 21 L17 18 Z" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-linejoin="round" />
        <text x="32" y="21.5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Smart Filters</text>
      </g>
    </g>
  </g>

  <!-- RIGHT CONTENT: DYNAMIC GRAPHICAL CARDS / ILLUSTRATIONS -->
  <g transform="translate(730, 0)">
    
    <!-- Background Card 3 (Filters / Terminal peek) -->
    <g class="floating-card-3" transform="translate(180, 45)" filter="url(#cardShadow)">
      <rect width="170" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect width="170" height="24" rx="12" fill="#0f172a" />
      <!-- Window controls -->
      <circle cx="15" cy="12" r="3.5" fill="#ef4444" opacity="0.8" />
      <circle cx="27" cy="12" r="3.5" fill="#eab308" opacity="0.8" />
      <circle cx="39" cy="12" r="3.5" fill="#22c55e" opacity="0.8" />
      
      <!-- Code snippet lines -->
      <text x="14" y="48" fill="#38bdf8" font-family="monospace" font-size="10.5" font-weight="bold">$ downloader(</text>
      <text x="24" y="66" fill="#a5f3fc" font-family="monospace" font-size="9.5">query=&quot;4k cyber&quot;,</text>
      <text x="24" y="82" fill="#a5f3fc" font-family="monospace" font-size="9.5">workers=16,</text>
      <text x="24" y="98" fill="#f472b6" font-family="monospace" font-size="9.5">filter=&quot;photo&quot;)</text>
    </g>

    <!-- Main Front Card (Active Image Download Preview) -->
    <g class="floating-card-1" transform="translate(50, 80)" filter="url(#cardShadow)">
      <rect width="250" height="175" rx="14" fill="url(#cardGrad2)" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.6" />
      
      <!-- Card Image Viewport -->
      <g transform="translate(12, 12)">
        <rect width="226" height="100" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
        
        <!-- Mountains / Sun landscape artwork inside frame -->
        <path d="M 0,85 L 50,45 L 90,75 L 150,30 L 226,85 L 226,100 L 0,100 Z" fill="url(#accentGrad)" opacity="0.65" />
        <path d="M 60,85 L 110,50 L 160,80 L 200,55 L 226,75 L 226,100 L 60,100 Z" fill="#00f2fe" opacity="0.35" />
        <circle cx="175" cy="30" r="12" fill="#fbbf24" opacity="0.85" />
        
        <!-- Scanning light sweep bar -->
        <line x1="0" y1="0" x2="0" y2="100" stroke="#ffffff" stroke-width="2" opacity="0.6" filter="url(#glow)">
          <animate attributeName="x1" values="0;226;0" dur="4s" repeatCount="indefinite" />
          <animate attributeName="x2" values="0;226;0" dur="4s" repeatCount="indefinite" />
        </line>
      </g>

      <!-- Status Bar Inside Card -->
      <g transform="translate(16, 126)">
        <text x="0" y="14" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Downloading Batch</text>
        <text x="175" y="14" fill="#38ef7d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">100% DONE</text>
        
        <!-- Progress bar container -->
        <rect x="0" y="21" width="218" height="6" rx="3" fill="#0f172a" />
        <!-- Animated progress bar fill -->
        <rect x="0" y="21" width="218" height="6" rx="3" fill="url(#primaryGrad)">
          <animate attributeName="width" values="40;218;218" dur="4s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>

    <!-- Floating Card 2: Interactive Floating Download Badge -->
    <g class="floating-card-2" transform="translate(10, 30)" filter="url(#cardShadow)">
      <rect width="90" height="75" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
      
      <!-- Bouncing Download Arrow Icon -->
      <g class="download-arrow" transform="translate(45, 34)">
        <circle cx="0" cy="0" r="18" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
        <path d="M 0,-8 L 0,6 M -5,1 L 0,6 L 5,1" fill="none" stroke="#00f2fe" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        <line x1="-7" y1="10" x2="7" y2="10" stroke="#38ef7d" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- Speed Indicator Floating Chip -->
    <g class="floating-card-3" transform="translate(240, 215)" filter="url(#cardShadow)">
      <rect width="115" height="38" rx="19" fill="#090d16" stroke="#38ef7d" stroke-width="1.2" />
      <circle cx="20" cy="19" r="6" fill="#38ef7d" class="sparkle" />
      <text x="35" y="23" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">⚡ 50+ req/s</text>
    </g>

  </g>
</svg>
